name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/android/**"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Debug APK (play + thirdParty)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run unit tests
        run: ./gradlew :app:testPlayDebugUnitTest

      - name: KtLint check
        run: ./gradlew :app:ktlintCheck

      - name: Build debug APKs
        run: ./gradlew :app:assemblePlayDebug :app:assembleThirdPartyDebug

      - name: Upload play APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-play-debug-apk
          path: apps/android/app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

      - name: Upload third-party APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-third-party-debug-apk
          path: apps/android/app/build/outputs/apk/thirdParty/debug/app-thirdParty-debug.apk
          if-no-files-found: error

  build-release:
    name: Signed release (AAB + APK)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && secrets.OPENCLAW_ANDROID_KEY_PASSWORD != ''
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write keystore
        run: |
          echo "${{ secrets.OPENCLAW_ANDROID_STORE_FILE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release bundles
        run: |
          ./gradlew \
            -POPENCLAW_ANDROID_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -POPENCLAW_ANDROID_STORE_PASSWORD="${{ secrets.OPENCLAW_ANDROID_STORE_PASSWORD }}" \
            -POPENCLAW_ANDROID_KEY_ALIAS="${{ secrets.OPENCLAW_ANDROID_KEY_ALIAS }}" \
            -POPENCLAW_ANDROID_KEY_PASSWORD="${{ secrets.OPENCLAW_ANDROID_KEY_PASSWORD }}" \
            -PopenclawBuildCommit="${{ github.sha }}" \
            -PopenclawBuildTimestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            :app:bundlePlayRelease :app:bundleThirdPartyRelease :app:assembleThirdPartyRelease

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-play-release-aab
          path: apps/android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      - name: Upload third-party release APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-third-party-release-apk
          path: apps/android/app/build/outputs/apk/thirdParty/release/app-thirdParty-release.apk
          if-no-files-found: error