name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Debug APK (play + thirdParty)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testPlayDebugUnitTest

      - name: KtLint check
        run: ./gradlew :app:ktlintCheck

      - name: Build debug APKs
        run: ./gradlew :app:assemblePlayDebug :app:assembleThirdPartyDebug

      - name: Stage APKs with predictable names
        run: |
          mkdir -p build/apk-upload
          cp app/build/outputs/apk/play/debug/*.apk build/apk-upload/openclaw-play-debug.apk
          cp app/build/outputs/apk/thirdParty/debug/*.apk build/apk-upload/openclaw-third-party-debug.apk

      - name: Upload play APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-play-debug-apk
          path: apps/android/build/apk-upload/openclaw-play-debug.apk
          if-no-files-found: error

      - name: Upload third-party APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-third-party-debug-apk
          path: apps/android/build/apk-upload/openclaw-third-party-debug.apk
          if-no-files-found: error